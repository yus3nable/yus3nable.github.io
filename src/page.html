<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f5"> <!-- taste-skill-ignore: 用户明确指定 Claude 暖色系。 -->
  <meta name="description" content="yus3nable 的个人阅读室。汇集课程、书籍与图文笔记，在线阅读、全文搜索，随时接着读。">
  <title>我的阅读室 · yus3nable</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script defer src="assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#library">跳到资料库</a>
  <div class="page-shell">
    <header class="site-header" id="top">
      <a class="wordmark" href="./" aria-label="yus3nable 阅读室首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 9C12 5 6 5 3 6v19c5-1 9 0 13 3 4-3 8-4 13-3V6c-3-1-9-1-13 3Z"/><path d="M16 9v19"/></svg><span>yus3nable</span></a>
      <nav aria-label="主导航"><a class="header-link" href="#library">资料库</a><a class="header-link" href="https://github.com/yus3nable" target="_blank" rel="noopener noreferrer">GitHub</a><div class="font-settings"><button id="font-menu-toggle" class="font-menu-toggle" type="button" aria-label="调整字号" aria-expanded="false" aria-controls="font-menu" title="调整字号"><span aria-hidden="true">Aa</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><div id="font-menu" class="font-menu" role="group" aria-label="字号设置" hidden><button id="font-down" type="button" aria-label="缩小字号">缩小</button><button id="font-reset" type="button" aria-label="恢复默认字号">默认</button><button id="font-up" type="button" aria-label="放大字号">放大</button></div></div></nav>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">我的阅读室</h1>
        <p class="intro-copy">课程、书籍与图文笔记，随时接着读。</p>
      </section>
      <aside id="continue-reading" class="continue-reading" hidden><div><span class="continue-caption">上次打开</span><a id="continue-link" href="#library"></a></div><button id="dismiss-continue" type="button" aria-label="隐藏继续阅读">×</button></aside>
      <section id="library" class="library" aria-labelledby="library-title">
        <div class="library-heading"><h2 id="library-title">全部内容 <span class="collection-total">{{TOTAL}}</span></h2><div class="filters" role="group" aria-label="内容类型"><button type="button" data-filter="全部" aria-pressed="true">全部</button><button type="button" data-filter="课程" aria-pressed="false">课程</button><button type="button" data-filter="书籍" aria-pressed="false">书籍</button><button type="button" data-filter="文章" aria-pressed="false">文章</button></div></div>
        <div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><label class="sr-only" for="search">搜索课程、书籍与正文</label><input id="search" type="search" placeholder="搜索课程、书籍与正文" autocomplete="off"><span class="search-shortcut" aria-hidden="true">/</span></div>
        <p class="search-status" id="search-status" role="status" hidden></p>
        <div class="collection-list" id="collection-list">{{COLLECTIONS}}</div>
        <p class="empty-state" id="empty-state" hidden>没有找到相关内容，试试其他关键词。</p>
        <section class="document-results" id="document-results" aria-labelledby="results-title" hidden><h3 id="results-title">正文中找到</h3><div id="results-list"></div><button id="more-results" class="more-results" type="button" hidden>查看更多结果</button></section>
        <button id="retry-search" class="more-results" type="button" hidden>重新加载正文搜索</button>
      </section>
    </main>
    <footer><p>yus3nable 的阅读室</p><a href="https://github.com/yus3nable" target="_blank" rel="noopener noreferrer">GitHub</a><a href="#top">回到顶部 <span aria-hidden="true">↑</span></a></footer>
  </div>
  <script id="library-data" type="application/json">{{DATA}}</script>
</body>
</html>
